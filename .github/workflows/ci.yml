name: CI

# Netlify builds and deploys on its own when main changes. This workflow is the
# gate that says whether it should have: lint, typecheck, build and tests on
# every pull request, and on main after a merge so a bad push is visible even
# though Netlify will happily deploy it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        # `npm run build` runs `tsc -b` first, so this covers typechecking too.
        # No Supabase variables: the build must succeed without them, and the
        # portal degrades to a "not configured" notice when they are absent.
        run: npm run build

      - name: Unit tests
        run: npm test
