# =============================================================
# netlify.toml — WashU SHPE
# Handles: SPA routing, security headers, caching, HTTPS
#
# Netlify serves the site at a root domain, so VITE_BASE_PATH is "/" here.
# The GitHub Pages workflow leaves it unset, where it defaults to
# "/SHPE_Website/". One build command, two correct outputs.
# =============================================================

# ── Build settings ───────────────────────────────────────────
[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_BASE_PATH = "/"
  # VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_SITE_URL and
  # VITE_ALLOWED_EMAIL_DOMAINS are set in the Netlify UI, not committed here.
  # The anon key is safe in a client bundle; the service role key must never
  # appear in any VITE_-prefixed variable.
  #
  # The first three must include the Functions scope in the Netlify UI ("All
  # scopes", the default, does): keep-supabase-awake and the card-meta edge
  # function read them at runtime, and values set in this file are visible to
  # the build only, never to functions or edge functions.
  #
  # VITE_SITE_URL must be the production origin in every deploy context,
  # previews included. Card URLs, QR codes and the NFC programming sheet are
  # built from it, and a chip written with a deploy-preview address breaks the
  # day that preview is deleted.

# ── Dev server (netlify dev) ──────────────────────────────────
[dev]
  command   = "npm run dev"
  port      = 5173
  targetPort = 5173

# ── SPA catch-all: send every non-asset request to index.html ─
# This is what makes a hard refresh on /portal/points work.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Force HTTPS (Netlify handles the cert automatically) ──────
[[redirects]]
  from   = "http://*"
  to     = "https://:splat"
  status = 301
  force  = true

# =============================================================
# Security & performance headers applied to every response
#
# Business cards (/card/*) need nothing extra, and nothing here is
# loosened for them:
#   - img-src already allows https://*.supabase.co (card photos come
#     from the card-media bucket) and style-src/font-src already allow
#     Google Fonts (the card font catalog). QR codes and vCards are
#     generated in the browser, so no new origin is contacted.
#   - The card-meta edge function adds only <title>, <meta> and
#     <link rel="canonical">, never an inline <script>, so script-src
#     stays as strict as it is.
#   - Referrer-Policy strict-origin-when-cross-origin means a site a
#     visitor opens from a card's links sees "washushpe.org", not which
#     member's card they came from.
#   - X-Frame-Options DENY / frame-ancestors 'none': a card can't be
#     framed by someone else's page to borrow SHPE's name.
#   - Cache-Control is Netlify's default for HTML (max-age=0,
#     must-revalidate), which is what a card page wants: a renamed or
#     hidden card must not linger in a browser cache.
#   - Robots: cards are noindex unless the member opts in, decided per
#     card by the page and the edge function, so there is deliberately
#     no blanket X-Robots-Tag rule for /card/* here.
# =============================================================
[[headers]]
  for = "/*"

  [headers.values]
    # ── Transport Security ──────────────────────────────────
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # ── Clickjacking protection ─────────────────────────────
    X-Frame-Options = "DENY"

    # ── MIME sniffing protection ────────────────────────────
    X-Content-Type-Options = "nosniff"

    # ── Referrer policy ─────────────────────────────────────
    Referrer-Policy = "strict-origin-when-cross-origin"

    # ── Permissions policy (disable unused browser features) ─
    #
    # camera=() stays OFF. QR check-in is architected for but not implemented;
    # the day a camera scanner ships, this becomes camera=(self) and nothing
    # else changes. Do not loosen it ahead of the feature.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()"

    # ── Content Security Policy ─────────────────────────────
    # Additions for the member portal are deliberately narrow: Supabase needs
    # connect-src for its REST/Auth/Realtime endpoints and img-src for storage.
    # The wildcard forms below are scoped to supabase.co rather than "*".
    #
    # script-src has NO 'unsafe-inline'. The only inline script this site ever
    # had was the GitHub Pages SPA decoder in index.html, removed along with the
    # 404.html generator in vite.config.ts. Supabase stores its session in
    # localStorage, so blocking inline script is the control that decides
    # whether a future XSS becomes full session theft. If you ever add an inline
    # <script>, add a 'sha256-...' hash for it here rather than reopening
    # 'unsafe-inline' for every script on the page.
    #
    # style-src keeps 'unsafe-inline': Tailwind and the Behold widget both set
    # element styles at runtime, and inline style is not a script-execution
    # primitive.
    Content-Security-Policy = """
      default-src 'self';
      script-src  'self' https://w.behold.so;
      style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src    'self' https://fonts.gstatic.com;
      img-src     'self' data: blob:
                  https://admissions.washu.edu
                  https://media.licdn.com
                  https://instagram.com
                  https://cdninstagram.com
                  https://*.cdninstagram.com
                  https://behold.so
                  https://*.behold.so
                  https://behold.pictures
                  https://*.supabase.co;
      media-src   'self' blob:
                  https://*.cdninstagram.com
                  https://behold.pictures;
      frame-src   'self'
                  https://wustl.advancementform.com;
      connect-src 'self'
                  https://api.behold.so
                  https://w.behold.so
                  https://feeds.behold.so
                  https://*.supabase.co
                  wss://*.supabase.co;
      object-src  'none';
      base-uri    'self';
      form-action 'self';
      frame-ancestors 'none';
      upgrade-insecure-requests;
    """

# ── CORS ─────────────────────────────────────────────────────
# Scoped to genuinely public, cacheable assets. It is deliberately NOT applied
# to /* any more: a blanket Access-Control-Allow-Origin: * on every response is
# broader than this site needs, and member-facing HTML has no reason to be
# readable cross-origin.
[[headers]]
  for = "/images/*"

  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# ── Long-lived cache for hashed Vite bundles ─────────────────
[[headers]]
  for = "/assets/*"

  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

# ── Short cache for HTML (always fresh) ──────────────────────
[[headers]]
  for = "/*.html"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Medium cache for fonts / PDFs / docs ─────────────────────
[[headers]]
  for = "/*.pdf"

  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.docx"

  [headers.values]
    Cache-Control = "public, max-age=604800"

# =============================================================
# Netlify Functions
#
# The member portal deliberately does NOT depend on these. All privileged
# logic lives in Supabase (Postgres functions + RLS), which is what lets the
# same static bundle work on GitHub Pages, where functions cannot run at all.
#
#   keep-supabase-awake  Scheduled (@daily, declared in the file). Calls
#                        get_app_config with the anon key so a free
#                        Supabase project never sits idle long enough to
#                        pause over summer. Runs on published deploys only.
# =============================================================
[functions]
  directory = "netlify/functions"

# =============================================================
# Netlify Edge Functions
#
#   card-meta  /card/* — writes each card's title, description, photo and
#              robots rule into <head> so link previews (iMessage, Slack,
#              LinkedIn) show the member rather than the homepage. Fails
#              open: on any error or a slow Supabase the page is served
#              untouched and the SPA renders the card as usual.
#
# Declared inline (`export const config` in
# netlify/edge-functions/card-meta.ts), not with an [[edge_functions]] block
# here, so the path, method and onError setting live next to the code that
# depends on them. Netlify merges a toml declaration with the inline one if
# both exist, so adding one here would only create a second place to edit.
# netlify/edge-functions is Netlify's default directory, so no
# `edge_functions` key is needed under [build] either.
# =============================================================
