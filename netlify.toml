# =============================================================
# netlify.toml — WashU SHPE
# Handles: SPA routing, security headers, caching, HTTPS
#
# Netlify serves the site at a root domain, so VITE_BASE_PATH is "/" here.
# The GitHub Pages workflow leaves it unset, where it defaults to
# "/SHPE_Website/". One build command, two correct outputs.
# =============================================================

# ── Build settings ───────────────────────────────────────────
[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_BASE_PATH = "/"
  # VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_SITE_URL and
  # VITE_ALLOWED_EMAIL_DOMAINS are set in the Netlify UI, not committed here.
  # The anon key is safe in a client bundle; the service role key must never
  # appear in any VITE_-prefixed variable.
  #
  # The first three must reach functions as well as the build:
  # keep-supabase-awake, admin-password-reset-link and the card-meta edge
  # function read them at runtime, and values set in this file are visible to
  # the build only, never to functions or edge functions. On a plan with
  # scopes, that means including the Functions scope ("All scopes", the
  # default, does); on a plan without them, every variable already reaches
  # functions.
  #
  # SUPABASE_SERVICE_ROLE_KEY is set in the Netlify UI too, for
  # admin-password-reset-link alone: marked as containing secret values, with
  # a value for the Production deploy context only (a deploy preview or
  # branch deploy runs unreviewed code, functions included), and never under a
  # VITE_ name, which would compile it into the public bundle. If the plan
  # offers scopes, give it the Functions scope only, which keeps it out of the
  # build. Not every plan does, and without them the key is visible to builds
  # too, so anything that runs during a build, a plugin included, could read
  # it: don't add build plugins you don't trust. Functions read variables as
  # of their deploy, so trigger a new deploy after setting or changing it.
  # Never here either: this file is committed.
  #
  # VITE_SITE_URL must be the production origin in every deploy context,
  # previews included. Card URLs, QR codes and the NFC programming sheet are
  # built from it, and a chip written with a deploy-preview address breaks the
  # day that preview is deleted.

# ── Dev server (netlify dev) ──────────────────────────────────
# Local development is `npm run dev` on http://localhost:5173, not this.
# netlify dev applies the [[headers]] below to the pages it proxies, and the
# production CSP blocks both the inline preamble Vite's React plugin injects
# and a local Supabase on http://127.0.0.1:54321, so the app doesn't work in a
# browser under it. That includes admin password reset links: the function's
# behaviour is covered by
# src/services/__tests__/adminPasswordResetLinkFunction.test.ts, its SQL by
# supabase/tests/password_reset_links.test.sql, and the whole flow is for
# trying on the production site, the one deploy context with the service key.
#
# `port` is where netlify dev itself listens and `targetPort` is Vite's, which
# it proxies to. The CLI needs them to be different numbers, so they are.
[dev]
  command   = "npm run dev"
  port      = 8888
  targetPort = 5173

# ── SPA catch-all: send every non-asset request to index.html ─
# This is what makes a hard refresh on /portal/points work.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Force HTTPS (Netlify handles the cert automatically) ──────
[[redirects]]
  from   = "http://*"
  to     = "https://:splat"
  status = 301
  force  = true

# =============================================================
# Security & performance headers applied to every response
#
# Business cards (/card/*) need nothing extra, and nothing here is
# loosened for them:
#   - img-src already allows https://*.supabase.co (card photos come
#     from the card-media bucket) and style-src/font-src already allow
#     Google Fonts (the card font catalog). QR codes and vCards are
#     generated in the browser, so no new origin is contacted.
#   - The card-meta edge function adds only <title>, <meta> and
#     <link rel="canonical">, never an inline <script>, so script-src
#     stays as strict as it is.
#   - Referrer-Policy strict-origin-when-cross-origin means a site a
#     visitor opens from a card's links sees "washushpe.org", not which
#     member's card they came from.
#   - X-Frame-Options DENY / frame-ancestors 'none': a card can't be
#     framed by someone else's page to borrow SHPE's name.
#   - Cache-Control is Netlify's default for HTML (max-age=0,
#     must-revalidate), which is what a card page wants: a renamed or
#     hidden card must not linger in a browser cache.
#   - Robots: cards are noindex unless the member opts in, decided per
#     card by the page and the edge function, so there is deliberately
#     no blanket X-Robots-Tag rule for /card/* here.
# =============================================================
[[headers]]
  for = "/*"

  [headers.values]
    # ── Transport Security ──────────────────────────────────
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # ── Clickjacking protection ─────────────────────────────
    X-Frame-Options = "DENY"

    # ── MIME sniffing protection ────────────────────────────
    X-Content-Type-Options = "nosniff"

    # ── Referrer policy ─────────────────────────────────────
    Referrer-Policy = "strict-origin-when-cross-origin"

    # ── Permissions policy (disable unused browser features) ─
    #
    # camera=() stays OFF. QR check-in is architected for but not implemented;
    # the day a camera scanner ships, this becomes camera=(self) and nothing
    # else changes. Do not loosen it ahead of the feature. The attendance
    # form's QR code needs no camera here: the phone's own camera app scans
    # it and simply opens the /attend/ link.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()"

    # ── Content Security Policy ─────────────────────────────
    # Additions for the member portal are deliberately narrow: Supabase needs
    # connect-src for its REST/Auth/Realtime endpoints and img-src for storage.
    # The wildcard forms below are scoped to supabase.co rather than "*".
    #
    # script-src has NO 'unsafe-inline'. The only inline script this site ever
    # had was the GitHub Pages SPA decoder in index.html, removed along with the
    # 404.html generator in vite.config.ts. Supabase stores its session in
    # localStorage, so blocking inline script is the control that decides
    # whether a future XSS becomes full session theft. If you ever add an inline
    # <script>, add a 'sha256-...' hash for it here rather than reopening
    # 'unsafe-inline' for every script on the page.
    #
    # style-src keeps 'unsafe-inline': Tailwind and the Behold widget both set
    # element styles at runtime, and inline style is not a script-execution
    # primitive.
    Content-Security-Policy = """
      default-src 'self';
      script-src  'self' https://w.behold.so;
      style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src    'self' https://fonts.gstatic.com;
      img-src     'self' data: blob:
                  https://admissions.washu.edu
                  https://media.licdn.com
                  https://instagram.com
                  https://cdninstagram.com
                  https://*.cdninstagram.com
                  https://behold.so
                  https://*.behold.so
                  https://behold.pictures
                  https://*.supabase.co;
      media-src   'self' blob:
                  https://*.cdninstagram.com
                  https://behold.pictures;
      frame-src   'self'
                  https://wustl.advancementform.com;
      connect-src 'self'
                  https://api.behold.so
                  https://w.behold.so
                  https://feeds.behold.so
                  https://*.supabase.co
                  wss://*.supabase.co;
      object-src  'none';
      base-uri    'self';
      form-action 'self';
      frame-ancestors 'none';
      upgrade-insecure-requests;
    """

# ── Attendance form links (/attend/<token>) ──────────────────
# The token in the path is the credential: anyone holding the link can
# submit attendance for that event while its check-in window is open. Pages
# get noindex from the app, but that only reaches crawlers that run
# JavaScript, so the header keeps the address out of every search index even
# if a link ends up somewhere public. Referrer-Policy above already stops the
# token travelling to other origins in a Referer header.
[[headers]]
  for = "/attend/*"

  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ── CORS ─────────────────────────────────────────────────────
# Scoped to genuinely public, cacheable assets. It is deliberately NOT applied
# to /* any more: a blanket Access-Control-Allow-Origin: * on every response is
# broader than this site needs, and member-facing HTML has no reason to be
# readable cross-origin.
[[headers]]
  for = "/images/*"

  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# ── Long-lived cache for hashed Vite bundles ─────────────────
[[headers]]
  for = "/assets/*"

  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

# ── Short cache for HTML (always fresh) ──────────────────────
[[headers]]
  for = "/*.html"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Medium cache for fonts / PDFs / docs ─────────────────────
[[headers]]
  for = "/*.pdf"

  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.docx"

  [headers.values]
    Cache-Control = "public, max-age=604800"

# =============================================================
# Netlify Functions
#
# All privileged logic still lives in Supabase (Postgres functions + RLS),
# which is what lets the same static bundle work on GitHub Pages, where
# functions cannot run at all. Only one feature needs a function: an admin's
# password reset link takes Supabase's service role key, which may only be
# used server-side, so creating one works only on this deploy (the database
# still decides who may). Everything else runs from Supabase alone.
#
#   keep-supabase-awake        Scheduled (@daily, declared in the file).
#                              Calls get_app_config with the anon key so a
#                              free Supabase project never sits idle long
#                              enough to pause over summer. Runs on
#                              published deploys only.
#                              Reads VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY.
#
#   health                     /.netlify/functions/health. A liveness check:
#                              answers { status: "ok", timestamp } with
#                              no-store and CORS * (GET, OPTIONS), so it says
#                              only that Netlify is running this site's
#                              functions. Never calls Supabase and reads no
#                              variables. Its limit of 100 requests a minute
#                              per IP is best effort, kept in one warm
#                              instance's memory. Nothing in the app calls it.
#
#   admin-password-reset-link  POST /.netlify/functions/admin-password-reset-link
#                              from Admin > Members > (member) >
#                              Administration. The database checks the
#                              caller is an admin, using their own session;
#                              then the service key asks Supabase Auth for a
#                              single-use recovery token; then the audit log
#                              records it; only then is the link returned.
#                              Same-origin only, so it sends no CORS headers.
#                              Reads VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY,
#                              SUPABASE_SERVICE_ROLE_KEY, and VITE_SITE_URL
#                              (optional; the request's origin otherwise).
# =============================================================
[functions]
  directory = "netlify/functions"

# =============================================================
# Netlify Edge Functions
#
#   card-meta  /card/* — writes each card's title, description, photo and
#              robots rule into <head> so link previews (iMessage, Slack,
#              LinkedIn) show the member rather than the homepage. Fails
#              open: on any error or a slow Supabase the page is served
#              untouched and the SPA renders the card as usual.
#
# Declared inline (`export const config` in
# netlify/edge-functions/card-meta.ts), not with an [[edge_functions]] block
# here, so the path, method and onError setting live next to the code that
# depends on them. Netlify merges a toml declaration with the inline one if
# both exist, so adding one here would only create a second place to edit.
# netlify/edge-functions is Netlify's default directory, so no
# `edge_functions` key is needed under [build] either.
# =============================================================
