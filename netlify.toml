# =============================================================
# netlify.toml — WashU SHPE
# Handles: SPA routing, security headers, caching, HTTPS
#
# Netlify serves the site at a root domain, so VITE_BASE_PATH is "/" here.
# The GitHub Pages workflow leaves it unset, where it defaults to
# "/SHPE_Website/". One build command, two correct outputs.
# =============================================================

# ── Build settings ───────────────────────────────────────────
[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_BASE_PATH = "/"
  # VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_SITE_URL and
  # VITE_ALLOWED_EMAIL_DOMAINS are set in the Netlify UI, not committed here.
  # The anon key is safe in a client bundle; the service role key must never
  # appear in any VITE_-prefixed variable.

# ── Dev server (netlify dev) ──────────────────────────────────
[dev]
  command   = "npm run dev"
  port      = 5173
  targetPort = 5173

# ── SPA catch-all: send every non-asset request to index.html ─
# This is what makes a hard refresh on /portal/points work.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Force HTTPS (Netlify handles the cert automatically) ──────
[[redirects]]
  from   = "http://*"
  to     = "https://:splat"
  status = 301
  force  = true

# =============================================================
# Security & performance headers applied to every response
# =============================================================
[[headers]]
  for = "/*"

  [headers.values]
    # ── Transport Security ──────────────────────────────────
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # ── Clickjacking protection ─────────────────────────────
    X-Frame-Options = "DENY"

    # ── MIME sniffing protection ────────────────────────────
    X-Content-Type-Options = "nosniff"

    # ── Referrer policy ─────────────────────────────────────
    Referrer-Policy = "strict-origin-when-cross-origin"

    # ── Permissions policy (disable unused browser features) ─
    #
    # camera=() stays OFF. QR check-in is architected for but not implemented;
    # the day a camera scanner ships, this becomes camera=(self) and nothing
    # else changes. Do not loosen it ahead of the feature.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()"

    # ── Content Security Policy ─────────────────────────────
    # Additions for the member portal are deliberately narrow: Supabase needs
    # connect-src for its REST/Auth/Realtime endpoints and img-src for storage.
    # Replace <project-ref> with your Supabase project reference, or use the
    # wildcard forms below, which are scoped to supabase.co rather than "*".
    #
    # Everything the public site already relied on is unchanged.
    Content-Security-Policy = """
      default-src 'self';
      script-src  'self' 'unsafe-inline' https://w.behold.so;
      style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src    'self' https://fonts.gstatic.com;
      img-src     'self' data: blob:
                  https://admissions.washu.edu
                  https://media.licdn.com
                  https://instagram.com
                  https://cdninstagram.com
                  https://*.cdninstagram.com
                  https://scontent*.cdninstagram.com
                  https://behold.so
                  https://*.behold.so
                  https://*.supabase.co;
      frame-src   'self'
                  https://wustl.advancementform.com;
      connect-src 'self'
                  https://api.behold.so
                  https://w.behold.so
                  https://*.supabase.co
                  wss://*.supabase.co;
      object-src  'none';
      base-uri    'self';
      form-action 'self';
      frame-ancestors 'none';
      upgrade-insecure-requests;
    """

# ── CORS ─────────────────────────────────────────────────────
# Scoped to genuinely public, cacheable assets. It is deliberately NOT applied
# to /* any more: a blanket Access-Control-Allow-Origin: * on every response is
# broader than this site needs, and member-facing HTML has no reason to be
# readable cross-origin.
[[headers]]
  for = "/images/*"

  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# ── Long-lived cache for hashed Vite bundles ─────────────────
[[headers]]
  for = "/assets/*"

  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

# ── Short cache for HTML (always fresh) ──────────────────────
[[headers]]
  for = "/*.html"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Medium cache for fonts / PDFs / docs ─────────────────────
[[headers]]
  for = "/*.pdf"

  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.docx"

  [headers.values]
    Cache-Control = "public, max-age=604800"

# =============================================================
# Netlify Functions
#
# The member portal deliberately does NOT depend on these. All privileged
# logic lives in Supabase (Postgres functions + RLS), which is what lets the
# same static bundle work on GitHub Pages, where functions cannot run at all.
# =============================================================
[functions]
  directory = "netlify/functions"
